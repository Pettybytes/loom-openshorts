services:
  backend:
    build: .
    container_name: openshorts-backend
    ports:
      # LOOM Segment 3B: bound to loopback only. This backend has zero
      # authentication on any endpoint (_assert_job_owner() is a no-op when
      # BILLING_ENABLED is unset), so it must never be reachable except
      # through the authenticated Caddy proxy at
      # /Users/user/Desktop/LOOM-Factory/infra/tunnel-proxy/, which fronts it
      # via Tailscale Funnel. Previously bound 0.0.0.0:8000 (all interfaces).
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: openshorts-frontend
    ports:
      - "5175:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    ports:
      - "3100:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend
